<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Activity</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Team activity</h1>
        <div class="meta">
          <span id="status-dot" class="conn"></span>
          <span id="updated">—</span>
        </div>
      </header>

      <div class="table">
        <div class="thead">
          <div class="col-name">Member</div>
          <div class="col-stat">Today</div>
          <div class="col-stat">This week</div>
          <div class="col-bars">Activity · 7 days</div>
        </div>
        <div id="rows" class="tbody">
          <div class="empty">Loading…</div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
