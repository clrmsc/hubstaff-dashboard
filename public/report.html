<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly Report</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="report">
    <div class="app">
      <header class="topbar">
        <h1>Monthly report</h1>
        <div class="meta">
          <a class="navlink" href="index.html">← Live activity</a>
          <span id="updated">—</span>
        </div>
      </header>

      <div class="controls">
        <div class="monthnav">
          <button id="prev" class="navbtn" title="Previous month">‹</button>
          <span id="month-label" class="month-label">—</span>
          <button id="next" class="navbtn" title="Next month">›</button>
        </div>
        <div class="sort">
          <span class="sort-label">Sort:</span>
          <button id="sort-hours" class="pillbtn active">Hours</button>
          <button id="sort-activity" class="pillbtn">Activity %</button>
        </div>
      </div>

      <div class="summary" id="summary"></div>

      <div class="table">
        <div class="thead rthead">
          <div class="col-rank">#</div>
          <div class="col-name">Member</div>
          <div class="col-grid"><div id="grid-head" class="daygrid"></div></div>
          <div class="col-num">Hours</div>
          <div class="col-num">Act.</div>
          <div class="col-num">Days</div>
        </div>
        <div id="rows" class="tbody">
          <div class="empty">Loading…</div>
        </div>
      </div>
    </div>

    <script src="report.js"></script>
  </body>
</html>
